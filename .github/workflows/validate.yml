name: validate

# Deliberately the same single command a human or an agent runs locally, so a
# green CI run and a green local run mean the same thing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Playwright's Chromium is exercised by the e2e stage of the gate.
      - run: npx playwright install --with-deps chromium

      - run: npm run validate
